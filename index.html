<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch when it is
         launched from the home screen, with the safe areas handled in CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installed app. iOS ignores an SVG apple-touch-icon and falls back to a
         screenshot of the page, so this one has to be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Testiddle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The browser chrome follows the theme rather than being fixed to one. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Timed SAT, ACT, SSAT, IELTS and TOEFL practice papers, marked and converted to each test's own score scale. Free." />
    <title>Testiddle: SAT, ACT, SSAT, IELTS and TOEFL practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
